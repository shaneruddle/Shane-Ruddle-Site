name: Deploy Shane Ruddle Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          npm install
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: shane-ruddle-site
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: "(default)"
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build --no-cache -t asia-east1-docker.pkg.dev/shane-ruddle-site/shane-ruddle/server:${{ github.sha }} .
          docker push asia-east1-docker.pkg.dev/shane-ruddle-site/shane-ruddle/server:${{ github.sha }}

      - name: Deploy to Cloud Run
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRAC_SERVICE_ACCOUNT: ${{ secrets.PRAC_SERVICE_ACCOUNT }}
          CAJUN_SERVICE_ACCOUNT: ${{ secrets.CAJUN_SERVICE_ACCOUNT }}
        run: |
          # Write service account JSONs to temp files to avoid special char issues in --set-env-vars
          echo "${PRAC_SERVICE_ACCOUNT}" > /tmp/prac_sa.json
          echo "${CAJUN_SERVICE_ACCOUNT}" > /tmp/cajun_sa.json
          PRAC_B64=$(base64 -w0 /tmp/prac_sa.json)
          CAJUN_B64=$(base64 -w0 /tmp/cajun_sa.json)
          gcloud run deploy shane-ruddle-server \
            --image asia-east1-docker.pkg.dev/shane-ruddle-site/shane-ruddle/server:${{ github.sha }} \
            --region asia-east1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,SMTP_HOST=${{ secrets.SMTP_HOST }},SMTP_PORT=${{ secrets.SMTP_PORT }},SMTP_USER=${{ secrets.SMTP_USER }},SMTP_PASS=${SMTP_PASS},ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY},PRAC_SERVICE_ACCOUNT=${PRAC_B64},CAJUN_SERVICE_ACCOUNT=${CAJUN_B64}" \
            --project shane-ruddle-site \
            --quiet
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting,firestore:rules,firestore:indexes --project shane-ruddle-site
