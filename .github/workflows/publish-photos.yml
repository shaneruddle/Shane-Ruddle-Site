name: Publish photos
# Started by the Publish button in the portal Photos tab (server.ts /api/photos/publish).
# Rebuilds the site from main with the latest photo choices and deploys Firebase Hosting only,
# so it's quicker than a full deploy and never touches Cloud Run or Firestore rules.
on:
  workflow_dispatch:
concurrency:
  group: publish-photos
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: shane-ruddle-site
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: "(default)"
          VITE_BUILD_ID: ${{ github.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project shane-ruddle-site
