name: Preview Shane Ruddle Site
# Builds the frontend for any branch other than main and deploys it to a Firebase Hosting
# preview channel named after the branch. Nothing here touches Cloud Run, Firestore or the live site.
on:
  push:
    branches-ignore:
      - main
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        run: |
          npm install
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: shane-ruddle-site
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: "(default)"
          VITE_BUILD_ID: ${{ github.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy preview channel
        run: |
          CHANNEL=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | cut -c1-36 | sed 's/-*$//')
          firebase hosting:channel:deploy "$CHANNEL" --expires 14d --project shane-ruddle-site --json | tee deploy.json
          URL=$(grep -o 'https://[^"]*web.app' deploy.json | head -1)
          echo "Preview URL: $URL"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="Preview: $URL" >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}
